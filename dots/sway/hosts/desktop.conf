# Sway settings for the desktop only. Included early by dots/sway/config,
# so `set` lines here override its defaults (listed at the top of dots/sway/config
# and in dots/sway/hosts/x201s.conf). Anything else sway accepts works too:
# output/input blocks, extra bindsym, exec.

# No swap on this machine, so hibernate can't work: suspend to RAM instead.
set $idle_sleep_cmd systemctl suspend

# DP-1 is turned portrait (transform 90), so in the layout it is 1080 wide and 1920 tall.
# DP-2 sits right of it at x=1080 (no gap for the pointer to cross), moved down 240
# so the two screens are centred on each other vertically ((1920 - 1440) / 2).
output DP-1 mode 1920x1080@60Hz pos 0 0 transform 90
output DP-2 mode 2560x1440@144Hz pos 1080 240

# Each workspace stays on one display: 1-3 on the portrait screen, 4-10 on the main one.
workspace 1 output DP-1
workspace 2 output DP-1
workspace 3 output DP-1
workspace 4 output DP-2
workspace 5 output DP-2
workspace 6 output DP-2
workspace 7 output DP-2
workspace 8 output DP-2
workspace 9 output DP-2
workspace 10 output DP-2

# Steam games and non-Steam shortcuts go to the main screen, on whichever of 4-10 is showing there.
assign [class="^steam_app_"] output DP-2

# Toggle bluetuith as a floating overlay: close it if open, otherwise launch it
bindsym $mod+Shift+b exec swaymsg '[app_id="^bluetuith$"] kill' || foot --app-id=bluetuith bluetuith
for_window [app_id="^bluetuith$"] floating enable, resize set width 60 ppt height 60 ppt, move position center
