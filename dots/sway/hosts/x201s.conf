# Sway settings for the ThinkPad X201s only. Included early by dots/sway/config,
# so `set` lines here override its defaults. Anything else sway accepts works too:
# output/input blocks, extra bindsym, exec.
#
# Defaults you can override (see the top of dots/sway/config):
#   set $bar_font_size 20
#   set $bar_height 50
#   set $lock_cmd swaylock -f -c 991111
#   set $lock_after 3600
#   set $screen_off_after 3660
#   set $idle_sleep_after 7200
#   set $idle_sleep_cmd systemctl hibernate
#
# The built-in panel is 1280x800 (probably LVDS-1; check with `swaymsg -t get_outputs`).

# Smaller bar for the small screen
set $bar_font_size 11
set $bar_height 24

# These came from the old config on another machine. Move them into that machine's
# file (dots/sway/hosts/<hostname>.conf) when it's added:
# output DP-3 pos 0 0 res 1080x1920
# output eDP-1 pos 3840 0 res 1080x1920
