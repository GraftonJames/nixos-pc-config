# Sway settings for the ThinkPad X280 only. Included early by dots/sway/config,
# so `set` lines here override its defaults (listed at the top of dots/sway/config
# and in dots/sway/hosts/x201s.conf). Anything else sway accepts works too:
# output/input blocks, extra bindsym, exec.
#
# The built-in panel is probably eDP-1 (1920x1080 or 1366x768, depending on the model;
# check with `swaymsg -t get_outputs`).
