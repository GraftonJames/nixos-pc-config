# foot terminal, linked to ~/.config/foot by modules/desktop.nix.
# Colours come from modules/theme.nix; don't set any here.
include=~/.config/theme/foot.ini

# 50% bigger than foot's default (size=8). Ctrl+= / Ctrl+- zoom one window.
font=monospace:size=12
# 10px of space between the text and the window edge.
pad=10x10
